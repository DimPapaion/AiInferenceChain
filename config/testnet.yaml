# ─────────────────────────────────────────────────────────────────────────────
# InferenceChain — Local Testnet Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# 4 DNN validator nodes (QoI consensus).
# All nodes share this config to produce the same genesis block.
#
# QUICK START — run scripts\start_testnet.bat
#
#   DNN nodes on ports 8010-8013 (REST) / 9010-9013 (P2P)
#   Dashboard:   http://localhost:8010/ui/
#   API docs:    http://localhost:8010/docs
#
# To import a DNN node wallet:
#   .venv\Scripts\python.exe wallet.py import <private_key> --out dnn0.json
#
# ─────────────────────────────────────────────────────────────────────────────

network: testnet-1

# BFT fault tolerance.
# f=1 → need 2f+1=3 votes.  4 DNN nodes → 1 Byzantine node tolerated.
f: 1

# ── Genesis token allocations ─────────────────────────────────────────────────
# Each DNN node address gets 1,000,000 INFER; 50,000 of that will be
# auto-staked at genesis (see dnn_nodes[].stake below).

genesis_allocations:
  2736393ddf3798aef2008b70cd8d530e3c1124f2: 1000000   # dnn-node-0 (resnet20)
  4f388dbd797891b668cb42f12c48c2cf0cd6ff5b: 1000000   # dnn-node-1 (resnet56)
  cc155e1df4ac34c267df127ac802df760efde7b3: 1000000   # dnn-node-2 (vgg11_bn)
  b649d10b829b7c3acdf8c3fd7a76e481c8add29e: 1000000   # dnn-node-3 (densenet40_12)

# ── DNN validator nodes (pre-admitted at genesis — PoM skipped for testnet) ──
